<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Blackjack Multiplayer</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a1a; color: #0f0; padding: 20px; max-width: 900px; margin: 0 auto; }
        .card { display: inline-block; background: white; color: black; padding: 8px 12px; margin: 4px; border-radius: 5px; font-size: 20px; font-weight: bold; }
        button { background: #0f0; color: #000; padding: 10px 20px; margin: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input { padding: 10px; font-size: 16px; background: #333; color: #0f0; border: 1px solid #0f0; border-radius: 5px; }
        .area { background: #222; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .hidden { display: none; }
        #messages { background: #000; padding: 10px; height: 150px; overflow-y: auto; font-size: 12px; border-radius: 5px; }
        .points { font-size: 14px; margin-top: 5px; color: #ff0; }
    </style>
</head>
<body>
    <h1>🃟 BLACKJACK MULTIPLAYER 🃟</h1>
    
    <div id="login">
        <div class="area">
            <h3>🎮 Вход в игру</h3>
            <input type="text" id="playerName" placeholder="Ваше имя">
            <br><br>
            <button id="createBtn">🎲 Создать комнату</button>
            <br><br>
            <input type="text" id="roomCode" placeholder="Код комнаты">
            <button id="joinBtn">🚪 Присоединиться</button>
        </div>
    </div>
    
    <div id="game" class="hidden">
        <div id="roomInfo" class="area"></div>
        
        <div id="dealerArea" class="area">
            <h3>🤵 ДИЛЕР</h3>
            <div id="dealerCards"></div>
            <div class="points" id="dealerPoints"></div>
        </div>
        
        <div id="playerArea" class="area">
            <h3>🎮 ВЫ</h3>
            <div id="playerCards"></div>
            <div class="points" id="playerPoints"></div>
            <div id="balance" style="margin-top: 10px;"></div>
        </div>
        
        <div id="bettingArea" class="area">
            <h3>💰 СТАВКА</h3>
            <input type="number" id="betAmount" value="10" min="1">
            <button id="betBtn">Сделать ставку</button>
        </div>
        
        <div id="actions" class="hidden">
            <button id="hitBtn">➕ ВЗЯТЬ КАРТУ</button>
            <button id="standBtn">✋ ОСТАНОВИТЬСЯ</button>
        </div>
        
        <div id="messages"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
