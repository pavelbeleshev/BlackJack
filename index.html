<!DOCTYPE html>
<html>
<head>
    <title>Blackjack</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        button { background: #0f0; color: #000; padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 10px; background: #333; color: #0f0; border: 1px solid #0f0; }
        .hidden { display: none; }
        #messages { background: #000; padding: 10px; height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🃟 BLACKJACK 🃟</h1>
    
    <div id="login">
        <input type="text" id="playerName" placeholder="Ваше имя">
        <button id="createBtn">🎲 Создать комнату</button>
        <br><br>
        <input type="text" id="roomCode" placeholder="Код комнаты">
        <button id="joinBtn">🚪 Присоединиться</button>
    </div>
    
    <div id="game" class="hidden">
        <div id="roomInfo"></div>
        <div id="messages"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
